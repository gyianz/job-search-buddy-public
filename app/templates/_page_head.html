<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --text: #172b4d; --subtle: #626f86; --border: #dcdfe4; --column: #f1f2f4;
    --brand: #0c66e4; --brand-hover: #0055cc;
  }
  html { background: #fff; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); font: 14px/1.43 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .topnav { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 56px; border-bottom: 1px solid var(--border); }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; color: var(--text); }
  .logo:hover { text-decoration: none; }
  .logo-mark { width: 24px; height: 24px; border-radius: 4px; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .page { max-width: 720px; margin: 0 auto; padding: 24px; }
  .btn { font: inherit; font-weight: 500; border: none; border-radius: 3px; padding: 6px 12px; cursor: pointer; background: var(--column); color: var(--text); line-height: 20px; display: inline-block; }
  .btn:hover { background: #dcdfe4; text-decoration: none; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-hover); color: #fff; }
</style>
